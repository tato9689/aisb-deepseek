<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 336' role='img' aria-labelledby='titulo desc'>
  <title id='titulo'>Umbrales LQI y RSSI en Zigbee2MQTT</title>
  <desc id='desc'>Red Zigbee con coordinador central y tres dispositivos etiquetados con linkquality 210, 90 y 35; la escala inferior marca -80 dBm como límite de entorno ruidoso.</desc>
  <rect width='640' height='336' rx='18' fill='#0e1116'/>
  <rect x='20' y='20' width='600' height='296' rx='14' fill='none' stroke='#1f2733' stroke-width='2'/>
  <line x1='320' y1='150' x2='140' y2='80' stroke='#3dd68c' stroke-width='6' stroke-linecap='round'/>
  <line x1='320' y1='150' x2='500' y2='80' stroke='#3dd68c' stroke-width='6' stroke-linecap='round'/>
  <line x1='320' y1='150' x2='460' y2='230' stroke='#ff9f0a' stroke-width='6' stroke-linecap='round'/>
  <circle cx='140' cy='80' r='28' fill='#0e1116' stroke='#3dd68c' stroke-width='5'/>
  <circle cx='500' cy='80' r='28' fill='#0e1116' stroke='#3dd68c' stroke-width='5'/>
  <circle cx='460' cy='230' r='28' fill='#0e1116' stroke='#ff9f0a' stroke-width='5'/>
  <circle cx='320' cy='150' r='34' fill='#0e1116' stroke='#ff9f0a' stroke-width='6'/>
  <text x='320' y='163' text-anchor='middle' fill='#ff9f0a' font-size='26' font-family='monospace' font-weight='bold'>ZC</text>
  <text x='140' y='85' text-anchor='middle' fill='#3dd68c' font-size='24' font-family='monospace' font-weight='bold'>210</text>
  <text x='500' y='85' text-anchor='middle' fill='#3dd68c' font-size='24' font-family='monospace' font-weight='bold'>90</text>
  <text x='460' y='235' text-anchor='middle' fill='#ff9f0a' font-size='24' font-family='monospace' font-weight='bold'>35</text>
  <rect x='60' y='278' width='520' height='12' fill='#1f2733' rx='6'/>
  <rect x='60' y='278' width='260' height='12' fill='#3dd68c' rx='6'/>
  <rect x='320' y='278' width='200' height='12' fill='#ff9f0a' rx='6'/>
  <text x='60' y='270' fill='#8b98a5' font-size='16' font-family='monospace'>-40 dBm</text>
  <text x='300' y='270' text-anchor='middle' fill='#8b98a5' font-size='16' font-family='monospace'>-80 dBm (límite oficial)</text>
  <text x='560' y='270' text-anchor='end' fill='#ff9f0a' font-size='16' font-family='monospace'>ruidoso</text>
</svg>