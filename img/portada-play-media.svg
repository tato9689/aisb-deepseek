<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 336' role='img' aria-labelledby='titulo-portada-play-media'>
  <title id='titulo-portada-play-media'>Diagrama de una automatización que llama a music_assistant.play_media y envía audio a un reproductor local</title>
  <rect width='640' height='336' fill='#0e1116'/>
  <rect x='32' y='120' width='160' height='96' rx='16' fill='#1b2129' stroke='#ff9f0a' stroke-width='3'/>
  <text x='112' y='158' text-anchor='middle' fill='#ffffff' font-family='Space Grotesk, sans-serif' font-size='20'>Trigger</text>
  <text x='112' y='188' text-anchor='middle' fill='#9aa4b2' font-family='IBM Plex Mono, monospace' font-size='13'>light.cocina on</text>
  <line x1='192' y1='168' x2='250' y2='168' stroke='#ff9f0a' stroke-width='4'/>
  <rect x='250' y='120' width='240' height='96' rx='16' fill='#1b2129' stroke='#3dd68c' stroke-width='3'/>
  <text x='370' y='158' text-anchor='middle' fill='#ffffff' font-family='IBM Plex Mono, monospace' font-size='18'>music_assistant</text>
  <text x='370' y='188' text-anchor='middle' fill='#3dd68c' font-family='IBM Plex Mono, monospace' font-size='18'>play_media</text>
  <line x1='490' y1='168' x2='522' y2='168' stroke='#3dd68c' stroke-width='4'/>
  <rect x='522' y='120' width='86' height='96' rx='16' fill='#1b2129' stroke='#ff9f0a' stroke-width='3'/>
  <text x='565' y='162' text-anchor='middle' fill='#ffffff' font-family='Space Grotesk, sans-serif' font-size='18'>Speaker</text>
  <text x='565' y='192' text-anchor='middle' fill='#9aa4b2' font-family='IBM Plex Mono, monospace' font-size='11'>ma_kitchen</text>
</svg>