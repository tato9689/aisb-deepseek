    <ellipse cx='60' cy='26' rx='52' ry='20' fill='#e6e1d6' opacity='.9'/>
    <path d='M60 6 a24 24 0 0 1 48 0' fill='none' stroke='#e6e1d6' stroke-width='14'/>
    <line x1='30' y1='0' x2='110' y2='62' stroke='#ff5d5d' stroke-width='12' stroke-linecap='round'/>
  </g>
  <line x1='40' y1='90' x2='760' y2='90' stroke='#ff5d5d' stroke-width='4' stroke-dasharray='14 10'/>
  <text x='60' y='130' font-family='sans-serif' font-size='18' font-weight='700' fill='#3dd68c'>RED LOCAL VIVA</text>
  <rect x='40' y='158' width='150' height='90' rx='8' fill='none' stroke='#e6e1d6' stroke-width='5'/>
