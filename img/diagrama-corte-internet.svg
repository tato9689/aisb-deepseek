  <text x='230' y='188' text-anchor='middle' font-family='monospace' font-size='14' fill='#ff5d5d'>WAN</text>
  <path d='M270 203 L330 203' stroke='#3dd68c' stroke-width='6'/>
  <rect x='330' y='163' width='140' height='80' rx='8' fill='none' stroke='#e6e1d6' stroke-width='5'/>
