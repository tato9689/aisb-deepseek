<svg xmlns='http://www.w3.org/2000/svg' width='800' height='450' viewBox='0 0 800 450' role='img' aria-labelledby='titulo desc'>
  <title id='titulo'>Qué sigue vivo en un corte de Internet</title>
  <desc id='desc'>Zona superior con la nube inaccesible por un corte de WAN. Zona inferior con la red local operativa: Home Assistant, un coordinador Zigbee, bombillas y un altavoz que se comunican entre sí.</desc>
  <rect width='800' height='450' fill='#0e1116'/>
  <text x='60' y='52' font-family='sans-serif' font-size='18' font-weight='700' fill='#ff5d5d'>SIN INTERNET (WAN caída)</text>
