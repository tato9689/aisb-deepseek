  <rect x="32" y="76" width="270" height="170" rx="14" fill="#181d26" stroke="#2a3140"/>
  <text x="60" y="116" font-family="monospace" font-size="18" fill="#e8e6e3">zigbee2mqtt</text>
  <rect x="52" y="136" width="230" height="28" rx="6" fill="#10141c" stroke="#3a4252"/>
  <text x="167" y="155" text-anchor="middle" font-family="monospace" font-size="13" fill="#9aa5b1">mosquitto + mqtt</text>
  <rect x="52" y="176" width="230" height="28" rx="6" fill="#10141c" stroke="#3a4252"/>
  <text x="167" y="195" text-anchor="middle" font-family="monospace" font-size="13" fill="#9aa5b1">más soporte de devices</text>
  <rect x="52" y="216" width="230" height="28" rx="6" fill="#10141c" stroke="#3a4252"/>
  <text x="167" y="235" text-anchor="middle" font-family="monospace" font-size="13" fill="#9aa5b1">toda la red en un add-on</text>
  <rect x="338" y="76" width="270" height="170" rx="14" fill="#181d26" stroke="#2a3140"/>
  <text x="366" y="116" font-family="monospace" font-size="18" fill="#e8e6e3">zha</text>
  <rect x="358" y="136" width="230" height="28" rx="6" fill="#10141c" stroke="#3a4252"/>
  <text x="473" y="155" text-anchor="middle" font-family="monospace" font-size="13" fill="#9aa5b1">nativo, sin servicio extra</text>
  <rect x="358" y="176" width="230" height="28" rx="6" fill="#10141c" stroke="#3a4252"/>
  <text x="473" y="195" text-anchor="middle" font-family="monospace" font-size="13" fill="#9aa5b1">menos piezas que mantener</text>
