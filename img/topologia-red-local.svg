<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="topologiaTitulo topologiaDesc" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="topologiaTitulo">Topología de red local para domótica sin nube</title>
  <desc id="topologiaDesc">Esquema de una red doméstica local: router, switch Ethernet, punto de acceso WiFi, servidor Home Assistant, NAS de música, reproductor Squeezelite, coordinador Zigbee y dispositivos finales Zigbee y ESPHome.</desc>
  <rect width="1200" height="700" rx="16" fill="#0e1116"/>
  <style>
    .caja { fill:#161b22; stroke:#30363d; stroke-width:2; }
    .titulo-nodo { fill:#e6edf3; font-size:16px; font-weight:600; }
    .subtitulo-nodo { fill:#8b949e; font-size:13px; }
    .etiqueta-enlace { fill:#8b949e; font-size:12px; }
    .ethernet { stroke:#8b949e; stroke-width:2; fill:none; }
    .wifi { stroke:#58a6ff; stroke-width:2; stroke-dasharray:6 4; fill:none; }
    .zigbee { stroke:#bc8cff; stroke-width:2; stroke-dasharray:5 5; fill:none; }
    .usb { stroke:#3dd68c; stroke-width:2; fill:none; }
    .audio { stroke:#ff9f0a; stroke-width:2; fill:none; }
  </style>

  <line x1="600" y1="58" x2="600" y2="78" class="ethernet"/>
  <line x1="600" y1="134" x2="600" y2="180" class="ethernet"/>
  <line x1="520" y1="208" x2="400" y2="208" class="ethernet"/>
  <path d="M560 236 V280 H320 V320" class="ethernet"/>
  <path d="M640 236 V280 H870 V320" class="ethernet"/>
  <line x1="680" y1="208" x2="770" y2="208" class="ethernet"/>
  <line x1="320" y1="392" x2="320" y2="480" class="usb"/>
  <line x1="870" y1="320" x2="870" y2="236" class="audio"/>
  <path d="M970 208 H1020 V340 H1060" class="audio"/>
  <line x1="270" y1="236" x2="190" y2="452" class="wifi"/>
  <line x1="270" y1="236" x2="190" y2="552" class="wifi"/>
  <line x1="430" y1="500" x2="580" y2="492" class="zigbee"/>
  <line x1="430" y1="512" x2="580" y2="584" class="zigbee"/>

  <rect x="520" y="10" width="160" height="48" rx="10" class="caja"/>
  <text x="600" y="40" text-anchor="middle" class="titulo-nodo">Internet</text>

  <rect x="520" y="78" width="160" height="56" rx="10" class="caja"/>
  <text x="600" y="101" text-anchor="middle" class="titulo-nodo">Router</text>
  <text x="600" y="121" text-anchor="middle" class="subtitulo-nodo">puerta de enlace</text>

  <rect x="520" y="180" width="160" height="56" rx="10" class="caja"/>
  <text x="600" y="208" text-anchor="middle" class="titulo-nodo">Switch</text>
  <text x="600" y="226" text-anchor="middle" class="subtitulo-nodo">Ethernet</text>

  <rect x="240" y="180" width="160" height="56" rx="10" class="caja"/>
  <text x="320" y="208" text-anchor="middle" class="titulo-nodo">Punto de acceso</text>
  <text x="320" y="226" text-anchor="middle" class="subtitulo-nodo">WiFi local</text>

  <rect x="770" y="180" width="200" height="56" rx="10" class="caja"/>
  <text x="870" y="208" text-anchor="middle" class="titulo-nodo">Squeezelite</text>
  <text x="870" y="226" text-anchor="middle" class="subtitulo-nodo">Raspberry Pi</text>

  <rect x="210" y="320" width="220" height="72" rx="10" class="caja"/>
  <text x="320" y="350" text-anchor="middle" class="titulo-nodo">Home Assistant</text>
  <text x="320" y="370" text-anchor="middle" class="subtitulo-nodo">hub local</text>

  <rect x="770" y="320" width="200" height="72" rx="10" class="caja"/>
  <text x="870" y="350" text-anchor="middle" class="titulo-nodo">NAS doméstico</text>
  <text x="870" y="370" text-anchor="middle" class="subtitulo-nodo">música local</text>

  <rect x="210" y="480" width="220" height="64" rx="10" class="caja"/>
  <text x="320" y="508" text-anchor="middle" class="titulo-nodo">Coordinador Zigbee</text>
  <text x="320" y="528" text-anchor="middle" class="subtitulo-nodo">USB o red</text>

  <rect x="50" y="420" width="140" height="64" rx="10" class="caja"/>
  <text x="120" y="448" text-anchor="middle" class="titulo-nodo">ESP32 sensor</text>
  <text x="120" y="468" text-anchor="middle" class="subtitulo-nodo">ESPHome (WiFi)</text>

  <rect x="50" y="520" width="140" height="64" rx="10" class="caja"/>
  <text x="120" y="548" text-anchor="middle" class="titulo-nodo">ESP32 relé</text>
  <text x="120" y="568" text-anchor="middle" class="subtitulo-nodo">ESPHome (WiFi)</text>

  <rect x="580" y="460" width="160" height="64" rx="10" class="caja"/>
  <text x="660" y="488" text-anchor="middle" class="titulo-nodo">Sensor Zigbee</text>
  <text x="660" y="508" text-anchor="middle" class="subtitulo-nodo">pila</text>

  <rect x="580" y="560" width="160" height="64" rx="10" class="caja"/>
  <text x="660" y="588" text-anchor="middle" class="titulo-nodo">Bombilla Zigbee</text>
  <text x="660" y="608" text-anchor="middle" class="subtitulo-nodo">router de malla</text>

  <rect x="1060" y="320" width="110" height="72" rx="10" class="caja"/>
  <text x="1115" y="350" text-anchor="middle" class="titulo-nodo">Amplificador</text>
  <text x="1115" y="370" text-anchor="middle" class="subtitulo-nodo">+ altavoz</text>

  <g transform="translate(60 636)">
    <line x1="0" y1="0" x2="32" y2="0" class="ethernet"/>
    <text x="42" y="4" class="etiqueta-enlace">Ethernet</text>
    <line x1="160" y1="0" x2="192" y2="0" class="wifi"/>
    <text x="202" y="4" class="etiqueta-enlace">WiFi local</text>
    <line x1="320" y1="0" x2="352" y2="0" class="zigbee"/>
    <text x="362" y="4" class="etiqueta-enlace">Zigbee (malla)</text>
    <line x1="520" y1="0" x2="552" y2="0" class="usb"/>
    <text x="562" y="4" class="etiqueta-enlace">USB</text>
    <line x1="680" y1="0" x2="712" y2="0" class="audio"/>
    <text x="722" y="4" class="etiqueta-enlace">Audio</text>
  </g>
</svg>