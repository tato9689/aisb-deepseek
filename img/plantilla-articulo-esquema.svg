<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 500' role='img' aria-labelledby='t desc'>
  <title id='t'>Anatomía de la plantilla de artículo</title>
  <desc id='desc'>Esquema de cabecera, título, entradilla, tabla de contenidos, secciones, bloque de código y pie</desc>
  <rect width='800' height='500' fill='#0e1116'/>
  <rect x='30' y='22' width='740' height='36' rx='6' fill='#1b222b'/>
  <text x='400' y='45' fill='#a7b0bb' font-family='system-ui' font-size='14' text-anchor='middle'>Cabecera · Casa Sin Nube</text>
  <rect x='30' y='72' width='740' height='52' rx='8' fill='#222b35'/>
  <text x='400' y='104' fill='#e6e9ee' font-family='system-ui' font-size='20' text-anchor='middle' font-weight='600'>Título del artículo</text>
  <rect x='30' y='136' width='740' height='30' rx='6' fill='#1b222b'/>
  <text x='400' y='157' fill='#a7b0bb' font-family='system-ui' font-size='13' text-anchor='middle'>Entradilla: la respuesta en dos líneas</text>
  <rect x='30' y='180' width='220' height='90' rx='8' fill='#12171d' stroke='#2b3540'/>
  <text x='140' y='203' fill='#ff9f0a' font-family='system-ui' font-size='14' text-anchor='middle'>Tabla de</text>
  <text x='140' y='222' fill='#ff9f0a' font-family='system-ui' font-size='14' text-anchor='middle'>contenidos</text>
  <rect x='270' y='180' width='500' height='32' rx='6' fill='#1b222b'/>
  <text x='520' y='201' fill='#e6e9ee' font-family='system-ui' font-size='13' text-anchor='middle'>Sección</text>
  <rect x='270' y='222' width='500' height='48' rx='6' fill='#12171d' stroke='#2b3540'/>
  <text x='520' y='251' fill='#a7b0bb' font-family='system-ui' font-size='13' text-anchor='middle'>Texto de desarrollo</text>
  <rect x='30' y='286' width='740' height='74' rx='8' fill='#0b0f14' stroke='#2b3540'/>
  <text x='400' y='316' fill='#3dd68c' font-family='ui-monospace' font-size='14' text-anchor='middle'>$ esphome run sensor.yaml</text>
  <text x='400' y='338' fill='#a7b0bb' font-family='system-ui' font-size='13' text-anchor='middle'>Bloque de código con badge de archivo y scroll horizontal</text>
  <rect x='30' y='374' width='740' height='58' rx='8' fill='#1b222b'/>
  <text x='400' y='400' fill='#e6e9ee' font-family='system-ui' font-size='14' text-anchor='middle'>Tabla de datos dentro de contenedor con scroll en móvil</text>
  <text x='400' y='418' fill='#a7b0bb' font-family='system-ui' font-size='12' text-anchor='middle'>Nunca como imagen: se lee, se copia y se indexa</text>
  <rect x='30' y='446' width='740' height='30' rx='6' fill='#12171d'/>
  <text x='400' y='466' fill='#a7b0bb' font-family='system-ui' font-size='12' text-anchor='middle'>Pie: transparencia, diario de guerra y descargo de no-afiliación</text>
</svg>