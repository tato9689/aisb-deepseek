<svg xmlns='http://www.w3.org/2000/svg' width='640' height='336' viewBox='0 0 640 336' role='img' aria-labelledby='titulo desc'>
  <title id='titulo'>Arquitectura de Music Assistant local sin nube</title>
  <desc id='desc'>Tres nodos conectados en una red local: un NAS con música, Home Assistant con Music Assistant y un reproductor Squeezelite con altavoz. Todo el flujo queda dentro de casa.</desc>
  <defs>
    <marker id='flecha' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto' markerUnits='strokeWidth'>
      <path d='M0,0 L0,6 L9,3 z' fill='#8b949e'/>
    </marker>
  </defs>
  <rect width='640' height='336' fill='#0e1116'/>
  <text x='32' y='36' fill='#8b949e' font-family='system-ui, sans-serif' font-size='15'>Red local — sin salir de casa</text>
  <line x1='170' y1='160' x2='250' y2='160' stroke='#8b949e' stroke-width='2' marker-end='url(#flecha)'/>
  <line x1='390' y1='160' x2='470' y2='160' stroke='#8b949e' stroke-width='2' marker-end='url(#flecha)'/>
  <rect x='40' y='110' width='130' height='100' rx='12' fill='#161b22' stroke='#ff9f0a' stroke-width='2'/>
  <text x='105' y='152' text-anchor='middle' fill='#e6edf3' font-family='system-ui, sans-serif' font-size='17' font-weight='600'>NAS</text>
  <text x='105' y='176' text-anchor='middle' fill='#8b949e' font-family='system-ui, sans-serif' font-size='13'>música local</text>
  <rect x='250' y='90' width='140' height='140' rx='12' fill='#161b22' stroke='#3dd68c' stroke-width='2'/>
  <text x='320' y='134' text-anchor='middle' fill='#e6edf3' font-family='system-ui, sans-serif' font-size='16' font-weight='600'>Home Assistant</text>
  <text x='320' y='158' text-anchor='middle' fill='#3dd68c' font-family='system-ui, sans-serif' font-size='14' font-weight='600'>Music Assistant</text>
  <text x='320' y='182' text-anchor='middle' fill='#8b949e' font-family='system-ui, sans-serif' font-size='12'>servidor + integración</text>
  <rect x='470' y='110' width='130' height='100' rx='12' fill='#161b22' stroke='#ff9f0a' stroke-width='2'/>
  <text x='535' y='146' text-anchor='middle' fill='#e6edf3' font-family='system-ui, sans-serif' font-size='16' font-weight='600'>Squeezelite</text>
  <text x='535' y='170' text-anchor='middle' fill='#8b949e' font-family='system-ui, sans-serif' font-size='13'>Pi + altavoz</text>
</svg>