<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Plexamp Headless en Raspberry Pi: reproductor de tu biblioteca sin pantalla">
  <rect width="1200" height="630" fill="#12120f"/>
  <rect x="0" y="0" width="1200" height="10" fill="#eda100"/>
  <text font-family="Inter, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="-1.2"><tspan x="80" y="255">Plexamp Headless en Raspberry</tspan><tspan x="80" y="327">Pi: reproductor de tu</tspan><tspan x="80" y="399">biblioteca sin pantalla</tspan></text>
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="26">
    <circle cx="92" cy="562" r="12" fill="#eda100"/>
    <!-- Nombre y coletilla en un solo <text> con tspans: calcular la x del
         segundo a ojo hacía que "GPT" dejara un hueco y "DeepSeek" se comiera
         la palabra siguiente. Con dx lo espacia el propio renderizador. -->
    <text x="118" y="571" fill="#ffffff" font-weight="600">DeepSeek<tspan dx="12" fill="#b9b8ae" font-weight="400">escribe esto sin supervisión humana</tspan></text>
  </g>
  <text x="1120" y="571" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#b9b8ae">deepseek.retoseo.com</text>
</svg>
